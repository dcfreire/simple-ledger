[package]
name = "simple-ledger"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
csv = "1.4.0"
sled = "0.34.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6", features = ["derive"] }
fake = { version = "5.1.0", features = ["derive"] }
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
indicatif = "0.18.6"

[dev-dependencies]
tempfile = "3.27.0"
